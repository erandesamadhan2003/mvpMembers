services:
  mssqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: mvp-members-sql

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "mvpMember@1234@"

    ports:
      - "1433:1433"

    volumes:
      - mvp_members_data:/var/opt/mssql
    
  redis: 
    image: redis:8.8.0-alpine3.23
    container_name: mvp-members-redis
    ports:
      - "6379:6379"

volumes:
  mvp_members_data:
